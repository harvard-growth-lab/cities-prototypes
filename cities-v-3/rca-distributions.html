  :root{
    --teal:#255862; --teal-dark:#1c454d; --teal-tint:#eef3f4; --teal-light:#8fb3ba;
    --orange:#e76565; --orange-dark:#cf4f2c; --orange-tint:#fdf0ec;
    --border:#e2e7e8; --border-strong:#c3ccce;
    --ink:#1a2226; --ink-soft:#5b686d; --ink-faint:#9aa6aa;
    --paper:#ffffff; --paper-soft:#fbfcfc;
    --shadow-md:0 8px 28px rgba(37,88,98,.14);
    color-scheme: light;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.45;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:28px 32px 48px}

  /* ---- header ---- */
      
  /* ---- controls ---- */
  .controls{display:flex; flex-wrap:wrap; gap:22px; align-items:flex-end; margin:0; padding:0 0 14px; border-bottom:1px solid var(--border)}
  .ctl{display:flex; flex-direction:column; gap:5px}
  .ctl label{font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint)}
  .seg{display:flex; border:1px solid var(--border-strong); border-radius:3px; overflow:hidden}
  .seg button{
    appearance:none; border:0; background:var(--paper); color:var(--ink-soft);
    font:inherit; font-size:13px; font-weight:600; padding:5px 12px; cursor:pointer;
    border-right:1px solid var(--border);
  }
  .seg button:last-child{border-right:0}
  .seg button:hover{background:var(--teal-tint); color:var(--teal)}
  .seg button[aria-pressed="true"]{background:var(--teal); color:#fff}
  .seg button:focus-visible{outline:2px solid var(--orange); outline-offset:-2px}

  /* ---- key ---- */
  .key{display:flex; flex-wrap:wrap; gap:28px; align-items:center; margin:22px 0 6px}
  /* Inside the tool the host section owns the top air and the column is
     narrower. One deliberate rhythm: host controls -> 24px -> key -> 14px
     -> chart, and no standalone page padding above or below. */
  .embedded .wrap{padding:0 26px 8px;}
  .embedded .key{margin:14px 0 0; gap:18px 26px;}
  /* nowrap so a long label wraps the whole legend item to the next line rather
     than stacking text beside its swatch */
  .key-item{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink); white-space:nowrap}
  .key-item b{color:var(--ink); font-weight:600}

  /* ---- chart ---- */
  .chart{position:relative; margin-top:6px}
  svg{display:block; width:100%; overflow:visible}
  text.tick{font-size:11.5px; fill:var(--ink-faint)}
  .grid{stroke:var(--border); stroke-width:1}
  .unity{stroke:var(--ink); stroke-width:1.25}
  .unity-label{font-size:12px; font-weight:700; fill:var(--ink)}
  .axis-title{font-size:13.5px; font-weight:600; fill:var(--ink)}
  .row-label{font-size:14.5px; font-weight:600; fill:var(--ink)}
  .row-sub{font-size:12.5px; fill:var(--ink-faint)}
  .band{fill:var(--paper-soft)}
  .design-band .band{fill:none}
  .design-band .key-item{gap:5px}
  .key-item b{font-weight:400}
  /* direct labels on the band swatch */
  .kd{font-size:13px;fill:var(--ink)}
  .col-head{font-size:10px;font-weight:700;letter-spacing:.09em;fill:var(--ink-soft)}
  .rows-btn{
    display:block;margin:4px auto 0;appearance:none;border:0;background:none;
    font:inherit;font-size:12.5px;font-weight:600;color:var(--teal);cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;
  }
  .kdl{stroke:var(--ink-faint);stroke-width:1}
  .whisk{stroke:var(--ink-faint); stroke-width:1}
  .cap{stroke:var(--ink-faint); stroke-width:1}
  .boxr{fill:var(--teal-tint); stroke:var(--teal-light); stroke-width:1}
  .med{stroke:var(--teal); stroke-width:2.5; stroke-linecap:round}
  /* Background MSAs sit well back — they are context for the box, not marks to
     read one by one. Hover promotes the one under the pointer to full strength
     (.dot-hover), which is the only time an individual one needs to be legible. */
  .dot-bg{fill:var(--ink-faint); opacity:.16}
  .dot-peer{fill:var(--ink-faint); opacity:.38; stroke:var(--paper); stroke-width:1.5}
  .dot-hover{fill:var(--ink-soft); stroke:var(--paper); stroke-width:1.5}
  .dot-focus{fill:var(--teal); stroke:var(--paper); stroke-width:2}
  .dot-focus-sm{fill:var(--teal); stroke:var(--paper); stroke-width:1.75}
  /* the one direct label per track sits over dots and the RCA=1 rule, so it
     carries a paper halo rather than a box */
  .val,.val-sm{paint-order:stroke fill; stroke:var(--paper); stroke-width:3.5px; stroke-linejoin:round}
  .val{font-size:13px; font-weight:700; fill:var(--ink)}
  .val-sm{font-size:12px; font-weight:600; fill:var(--ink-soft)}
  .halo{fill:none; stroke:var(--ink-soft); stroke-width:2}
  .halo-subject{stroke:var(--teal)}
  .sep{stroke:var(--border); stroke-width:1}
  .bandr{fill:#dfe6e8}
  .bandm{fill:#b7c9ce}

  /* ---- intro choreography: the chart assembles itself in four steps ---- */
  .intro-anim .dot-bg,.intro-anim .dot-peer,
  .intro-anim .bandr,.intro-anim .bandm,.intro-anim .boxr,
  .intro-anim .whisk,.intro-anim .cap,.intro-anim .med,
  .intro-anim .dot-focus,.intro-anim .val{transition:opacity .45s ease;}
  /* the axis is the opening act: it draws itself — the title, then the
     gridlines sweeping left to right, then the RCA = 1 line — and stays,
     so every later step builds on what the reader has already been shown */
  .intro-anim .axis-title{opacity:0;animation:axisfade .5s ease forwards;}
  .intro-anim .grid{
    stroke-dasharray:1;stroke-dashoffset:1;
    animation:axisdraw .45s ease forwards;
    animation-delay:calc(var(--i,0)*.05s);
  }
  .intro-anim .tick{
    opacity:0;animation:axisfade .35s ease forwards;
    animation-delay:calc(var(--i,0)*.05s + .12s);
  }
  .intro-anim .unity{
    stroke-dasharray:1;stroke-dashoffset:1;
    animation:axisdraw .5s ease forwards;animation-delay:.5s;
  }
  .intro-anim .unity-label{
    opacity:0;animation:axisfade .4s ease forwards;animation-delay:.7s;
  }
  .intro-anim.s1 .grid,.intro-anim.s1 .unity{animation:none;stroke-dasharray:none;}
  .intro-anim.paused .grid,.intro-anim.paused .tick,.intro-anim.paused .unity,
  .intro-anim.paused .unity-label,.intro-anim.paused .axis-title{animation-play-state:paused;}
  @keyframes axisdraw{to{stroke-dashoffset:0;}}
  @keyframes axisfade{to{opacity:1;}}
  .intro-anim .dot-bg,.intro-anim .dot-peer{opacity:0;}
  .intro-anim.s1 .dot-bg,.intro-anim.s1 .dot-peer{opacity:.35;}
  .intro-anim .bandr,.intro-anim .bandm,.intro-anim .boxr,.intro-anim .whisk,
  .intro-anim .cap,.intro-anim .med,.intro-anim .dot-focus,.intro-anim .val{opacity:0;}
  .intro-anim.s2 .bandr,.intro-anim.s2 .bandm,.intro-anim.s2 .boxr,

  .intro-anim.s2 .dot-bg,.intro-anim.s2 .dot-peer{opacity:.10;}
  .intro-anim.s3 .med{opacity:1;}
  .intro-anim.s4 .dot-focus,.intro-anim.s4 .val{opacity:1;}
  .intro-anim.s4 .dot-bg{opacity:0;}
  .intro-anim.s4 .dot-peer{opacity:.38;}

  /* ---- direct labels: the intro names each mark in place, in the same
     teal bubble the tooltips use, one at a time on the first row ---- */
  #chart{position:relative;}
  .intro-label{
    position:absolute;transform:translate(-50%,-100%);
    background:var(--teal);color:#fff;font-size:12px;font-weight:600;
    padding:4px 9px;border-radius:4px;white-space:nowrap;pointer-events:none;
    opacity:0;transition:opacity .3s ease;z-index:4;
  }
  .intro-label::after{
    content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:var(--teal);
  }
  .intro-label.on{opacity:1;}
  /* variant for the axis explainer: sits under its anchor, arrow up, wraps */
  .intro-label.below{transform:translate(-50%,0);}
  .intro-label.below::after{
    top:auto;bottom:100%;
    border-top-color:transparent;border-bottom-color:var(--teal);
  }
  .intro-label.wide{white-space:normal;width:330px;text-align:left;line-height:1.45;}

  /* ---- replay sits at the right end of the key row ---- */
  #replayBtn{
    appearance:none;border:0;background:none;font:inherit;font-size:12.5px;font-weight:600;
    color:var(--teal);cursor:pointer;text-decoration:underline;text-underline-offset:3px;
    white-space:nowrap;margin-left:auto;
  }

  /* ---- tooltip ---- */
  .tip{
    position:absolute; pointer-events:none; opacity:0; transition:opacity .09s;
    background:var(--paper); border:1px solid var(--border-strong); border-radius:3px;

  .tip dl{margin:7px 0 0; padding-top:7px; border-top:1px solid var(--border); display:grid; grid-template-columns:auto auto; gap:2px 14px; font-size:12.5px}
  .tip dt{color:var(--ink-soft)} .tip dd{margin:0; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink)}

  table{border-collapse:collapse; width:100%; margin-top:22px; font-size:13.5px}

function jit(seed){
  let h = 2166136261;
  for (let i=0;i<seed.length;i++){ h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (((h >>> 0) % 1000) / 1000) - 0.5;
}

function el(tag, attrs, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

/* ----------------------------------------------------------------- sorting */
let rowLimit = 10;   /* top 10 by default; the host's "Show all" lifts it */
function rows(){
  let r = DATA.rows.slice();
  if (state.filter === "above1") r = r.filter(d => d.boston >= 1);
  if (state.sort === "rca") r.sort((a,b)=> b.boston - a.boston);
  if (state.sort === "pct") r.sort((a,b)=> b.pctRank - a.pctRank);
  if (state.sort === "jobs") r.sort((a,b)=> b.bostonEmp - a.bostonEmp);
  if (rowLimit) r = r.slice(0, rowLimit);
  return r;
}

/* ----------------------------------------------------------------- render */
let hits = [];   // {x,y,r,kind,payload}

function render(){
  const R = rows();
  const W = document.getElementById("chart").clientWidth;
  if (W < 360) return; /* hidden or mid-layout (embedded view not ready) — the ResizeObserver re-renders on reveal */
  const H = PAD.t + R.length * ROW_H + PAD.b;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  while (svg.childNodes.length > 1) svg.removeChild(svg.lastChild);
  hits = [];

  const x0 = PAD.l, x1 = W - PAD.r;
  /* Domain is clamped at both ends: a handful of one-industry towns run to 100×
     and would either escape the plot or flatten everything else. Points outside
     are pinned to the edge as a chevron, and the tooltip still reports the
     true value. */
  const lo = Math.log(DOM[0]), hi = Math.log(DOM[1]);
  const X  = v => x0 + (Math.log(Math.min(Math.max(v, DOM[0]), DOM[1])) - lo) / (hi - lo) * (x1 - x0);

  /* --- row bands, painted under the grid -------------------------- */
  const gBand = el("g", {}, svg);
  R.forEach((d, i) => {
    const cy = PAD.t + i * ROW_H + ROW_H / 2;
    el("rect", { x:x0, y:cy-BAND_H/2, width:x1-x0, height:BAND_H, class:"band" }, gBand);
  });

  /* --- axis ------------------------------------------------------ */
  const gAxis = el("g", {}, svg);
  el("text", { x:x0, y:22, class:"axis-title" }, gAxis)
    .append(document.createTextNode("Times more concentrated in this metro than in the United States"));

  TICKS.forEach((t, ti) => {
    const x = X(t);
    el("line", { x1:x, x2:x, y1:PAD.t-18, y2:H-PAD.b, pathLength:"1",
                 style:"--i:"+ti, class: t===1 ? "unity" : "grid" }, gAxis);
    const lab = el("text", { x, y:PAD.t-26, "text-anchor":"middle", style:"--i:"+ti, class:"tick" }, gAxis);
    lab.appendChild(document.createTextNode(t===1 ? "" : (t<1 ? t+"×" : t+"×")));
  });
  const uy = el("text", { x:X(1), y:PAD.t-26, "text-anchor":"middle", class:"unity-label" }, gAxis);
  uy.appendChild(document.createTextNode("RCA = 1"));
  /* the left block mirrors the right: the column header's two lines sit on
     the same baselines as the axis title and the tick row, right-aligned
     with the labels they name */
  const rt1 = el("text", { x:PAD.l-18, y:22, "text-anchor":"end", class:"col-head" }, gAxis);
  rt1.appendChild(document.createTextNode("MOST SPECIALIZED"));
  const rt2 = el("text", { x:PAD.l-18, y:38, "text-anchor":"end", class:"col-head" }, gAxis);
  rt2.appendChild(document.createTextNode("TRADABLE INDUSTRIES"));

  /* --- rows ------------------------------------------------------ */
  R.forEach((d, i) => {
    const cy = PAD.t + i * ROW_H + ROW_H / 2;
    const g = el("g", {}, svg);
    if (i) el("line", { x1:24, x2:W-24, y1:PAD.t + i*ROW_H, y2:PAD.t + i*ROW_H, class:"sep" }, g);

    const l = el("text", { x:PAD.l-18, y:cy+5, "text-anchor":"end", class:"row-label" }, g);
    l.appendChild(document.createTextNode(d.label));

    drawTrack(g, d, X, cy);
  });
}

function drawTrack(g, d, X, cy){
  const b = d.national, bh = BOX_H, hh = bh/2, bandH = BAND_H;

  if (state.design === "band"){
    /* the friendly form: one soft pill for the full range, a darker middle
       for the middle half — same positions, no statistical iconography */
    el("rect", { x:X(b.lo), y:cy-6, width:Math.max(X(b.hi)-X(b.lo), 2), height:12, rx:6, class:"bandr" }, g);
    el("rect", { x:X(b.q1), y:cy-6, width:Math.max(X(b.q3)-X(b.q1), 1.5), height:12, class:"bandm" }, g);
    el("line", { x1:X(b.med), x2:X(b.med), y1:cy-9, y2:cy+9, class:"med" }, g);
  } else {
    /* whiskers */
    el("line", { x1:X(b.lo), x2:X(b.hi), y1:cy, y2:cy, class:"whisk" }, g);
    el("line", { x1:X(b.lo), x2:X(b.lo), y1:cy-hh*0.62, y2:cy+hh*0.62, class:"cap" }, g);
    el("line", { x1:X(b.hi), x2:X(b.hi), y1:cy-hh*0.62, y2:cy+hh*0.62, class:"cap" }, g);
    /* box */
    el("rect", { x:X(b.q1), y:cy-hh, width:Math.max(X(b.q3)-X(b.q1), 1.5), height:bh, rx:1.5, class:"boxr" }, g);
    el("line", { x1:X(b.med), x2:X(b.med), y1:cy-hh, y2:cy+hh, class:"med" }, g);
  }
  hits.push({ x:X(b.med), y:cy, r:0, kind:"box", box:b, row:d });

  /* "None" strips back to the box and Boston; "All MSAs" adds the wider sample
     behind the named peers. */
  const dm = introDots || state.dots;
  const pts = [];
  if (dm !== "none"){
    if (dm === "all")
      d.natSample.forEach((p,k) => pts.push({ v:p.v, cls:"dot-bg", r:3, name:p.name, seed:d.naics+"a"+k }));
    d.peers.filter(p => PEER_SET.has(p.name))
           .forEach(p => pts.push({ v:p.v, cls:"dot-peer", r:4.5, name:p.name, seed:d.naics+"p"+p.name }));
  }
  for (const p of pts){
    const y = cy + jit(p.seed) * (bandH - p.r*2 - 2);
    const px = X(p.v), over = p.v > DOM[1];
    if (over)  el("path", { d:`M${px-p.r-1},${y-p.r} L${px+p.r+2},${y} L${px-p.r-1},${y+p.r} Z`, class:p.cls }, g);
    else       el("circle", { cx:px, cy:y, r:p.r, class:p.cls }, g);
    if (p.name) hits.push({ x:px, y, r:p.r, kind:"city", name:p.name, v:p.v, emp:p.emp, over, row:d });
  }

  /* the subject */
  const sx = X(d.boston), r = 6.5;
  el("circle", { cx:sx, cy, r, class:"dot-focus" }, g);
  const lab = el("text", { x:sx+11, y:cy+4.5, class:"val" }, g);
  lab.appendChild(document.createTextNode(fmtx(d.boston)));
  hits.push({ x:sx, y:cy, r, kind:"city", name:"Boston Metro", v:d.boston,
              emp:d.bostonEmp, pct:d.pctRank, subject:true, row:d });
}

/* ----------------------------------------------------------------- hover */
const chart = document.getElementById("chart");
let halo = null;

chart.addEventListener("pointermove", e => {
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const sx = (e.clientX - rect.left) / rect.width  * vb.width;
  const sy = (e.clientY - rect.top)  / rect.height * vb.height;

  let best = null, bestD = 1e9;
  for (const h of hits){
    if (h.kind !== "city") continue;
    const dx = h.x - sx, dy = (h.y - sy) * 1.8;      // favour the row you're in
    const dd = dx*dx + dy*dy;
    if (dd < bestD){ bestD = dd; best = h; }
  }
  const near = best && Math.sqrt(bestD) < 22;
  if (near){ showCity(best, e); return; }

  /* fall back to the box under the pointer */
  let box = null;
  for (const h of hits){
    if (h.kind !== "box") continue;
    const bh = BAND_H / 2;
    if (Math.abs(h.y - sy) <= bh){ box = h; break; }
  }
  if (box) showBox(box, e); else hide();
});
chart.addEventListener("pointerleave", hide);

function place(e){
  const cr = chart.getBoundingClientRect();
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX - cr.left + 16, y = e.clientY - cr.top - h - 12;
  if (x + w > cr.width) x = e.clientX - cr.left - w - 16;
  if (y < 0) y = e.clientY - cr.top + 18;
  tip.style.left = x + "px"; tip.style.top = y + "px"; tip.style.opacity = 1;
}

function markHalo(h){
  if (halo) halo.remove();
  halo = el("g", {}, svg);
  /* repaint the hovered dot at full strength on top of its faded self; skipped
     for the subject (already saturated) and for off-axis chevrons (not circles) */
  if (!h.subject && !h.over)
    el("circle", { cx:h.x, cy:h.y, r:h.r, class:"dot-hover" }, halo);
  el("circle", { cx:h.x, cy:h.y, r:h.r + 4,
                 class: "halo" + (h.subject ? " halo-subject" : "") }, halo);
}

function showCity(h, e){
  markHalo(h);
  tip.textContent = "";
  const v = document.createElement("div"); v.className = "tv";
  v.textContent = fmtx(h.v); v.style.color = h.subject ? "var(--teal)" : "var(--ink)";
  const n = document.createElement("div"); n.className = "tn"; n.textContent = h.name;
  const m = document.createElement("div"); m.className = "tm";
  m.textContent = h.row.label + " · among U.S. metropolitan areas"
    + (h.over ? " · beyond the axis" : "");
  tip.append(v, n, m);

  const dl = document.createElement("dl");
  const add = (k, val) => { const dt=document.createElement("dt"); dt.textContent=k;
                            const dd=document.createElement("dd"); dd.textContent=val; dl.append(dt,dd); };
  if (h.emp != null) add("Jobs", int(h.emp));
  if (h.pct != null) add("Rank", ord(h.pct) + " percentile");
  add("Median metro", fmtx(h.row.national.med));
  tip.appendChild(dl);
  place(e);
}

function showBox(h, e){
  if (halo){ halo.remove(); halo = null; }
  const b = h.box;
  tip.textContent = "";
  const v = document.createElement("div"); v.className = "tv"; v.textContent = fmtx(b.med);
  const n = document.createElement("div"); n.className = "tn";
  n.textContent = "Median U.S. metropolitan area";
  const m = document.createElement("div"); m.className = "tm"; m.textContent = h.row.label;
  tip.append(v, n, m);
  const dl = document.createElement("dl");
  const add = (k, val) => { const dt=document.createElement("dt"); dt.textContent=k;
                            const dd=document.createElement("dd"); dd.textContent=val; dl.append(dt,dd); };
  add("Middle half", fmt(b.q1) + " – " + fmt(b.q3) + "×");
  add("Whiskers",    fmt(b.lo) + " – " + fmt(b.hi) + "×");
  add("Full range",  fmt(b.min) + " – " + fmt(b.max) + "×");
  add("Metros", int(b.n));
  tip.appendChild(dl);
  place(e);
}

function hide(){ tip.style.opacity = 0; if (halo){ halo.remove(); halo = null; } }

/* The intro's Boston beat opens the real tooltip rather than a bubble, so
   the reader leaves knowing the marks answer the cursor. Anchored to the
   first row's Boston dot, in screen coordinates. */
function demoTip(){
  const h = hits.find(t => t.kind === "city" && t.subject);
  if (!h) return;
  const r = svg.getBoundingClientRect();
  const k = r.width / svg.viewBox.baseVal.width;
  showCity(h, { clientX: r.left + h.x * k, clientY: r.top + h.y * k });
}

/* ----------------------------------------------------------------- key */
function buildKey(){
  const k = document.getElementById("key");
  k.textContent = "";
  const item = (svgStr, html, w = 64, h = 20) => {
    const d = document.createElement("div"); d.className = "key-item";
    const s = document.createElementNS(NS,"svg");
    s.setAttribute("width", w); s.setAttribute("height", h); s.setAttribute("viewBox","0 0 "+w+" "+h);
    s.innerHTML = svgStr; d.appendChild(s);
    const t = document.createElement("span"); t.innerHTML = html; d.appendChild(t);
    k.appendChild(d);
  };
  if (state.design === "band"){
    item(`<text x="2" y="11" class="kd">Where U.S. metros fall</text>
          <line x1="12" y1="14" x2="12" y2="20" class="kdl"/>
          <rect x="2" y="20" width="236" height="12" rx="6" class="bandr"/>
          <rect x="88" y="20" width="64" height="12" class="bandm"/>
          <line x1="120" y1="32" x2="120" y2="36.5" class="kdl"/>
          <text x="120" y="49" text-anchor="middle" class="kd">the darker middle holds half of them</text>`,
         ``, 240, 53);
    item(`<line x1="8" x2="8" y1="3" y2="17" class="med"/>`,
         `The <b>typical metro</b>`, 16);
  } else {
    item(`<text x="105" y="11" text-anchor="middle" class="kd">the typical metro</text>
          <line x1="105" y1="13.5" x2="105" y2="16" class="kdl"/>
          <line x1="4" x2="236" y1="24" y2="24" class="whisk"/>
          <line x1="4" x2="4" y1="19" y2="29" class="cap"/><line x1="236" x2="236" y1="19" y2="29" class="cap"/>
          <rect x="60" y="17" width="90" height="14" rx="1.5" class="boxr"/>
          <line x1="105" x2="105" y1="17" y2="31" class="med"/>
          <line x1="85" y1="31" x2="85" y2="36.5" class="kdl"/>
          <text x="85" y="49" text-anchor="middle" class="kd">half of all metros</text>`,
         ``, 240, 53);
  }
  if (state.dots === "peers")
    item(`<circle cx="7" cy="10" r="4.5" class="dot-peer"/><circle cx="20" cy="10" r="4.5" class="dot-peer"/>`,
         `Peer metros`, 27);
  else if (state.dots === "all")
    item(`<circle cx="6" cy="10" r="3" class="dot-bg"/><circle cx="20" cy="10" r="3" class="dot-bg"/>
          <circle cx="36" cy="10" r="4.5" class="dot-peer"/>`,
         `Other metros`, 44);
  item(`<circle cx="8" cy="10" r="6.5" class="dot-focus"/>`,
       `<b>Boston Metro</b>`, 16);
}

/* ----------------------------------------------------------------- table */
function buildTable(){
  const w = document.getElementById("tablewrap");
  w.textContent = "";
  const t = document.createElement("table");
  const head = ["Industry","Boston Metro RCA","Jobs in the Boston metro","National percentile",
                "Metros compared","Median metro","Middle half of metros","Full range across metros"];
  const thead = t.createTHead(); const hr = thead.insertRow();
  head.forEach(h => { const th = document.createElement("th"); th.textContent = h; hr.appendChild(th); });
  const tb = t.createTBody();
  for (const d of rows()){
    const r = tb.insertRow();
    const cell = (txt, cls) => { const c = r.insertCell(); c.textContent = txt; if (cls) c.className = cls; };
    cell(d.label);
    cell(fmtx(d.boston), "hi");
    cell(int(d.bostonEmp));
    cell(ord(d.pctRank));
    cell(int(d.national.n));
    cell(fmtx(d.national.med));
    cell(fmt(d.national.q1) + "–" + fmt(d.national.q3) + "×");
    cell(fmt(d.national.min) + "–" + fmt(d.national.max) + "×");
  }
  console.assert(!tb.rows.length || tb.rows[0].cells.length === hr.cells.length,
                 "table header/body column mismatch");
  w.appendChild(t);
}

/* ----------------------------------------------------------------- wiring */
const KEYS = ["dots","sort","filter","view"];
const keyOf = b => KEYS.find(k => k in b.dataset);

function syncView(){
  document.getElementById("chart").hidden      = state.view !== "chart";
  document.getElementById("key").hidden        = state.view !== "chart";
  document.getElementById("tablewrap").hidden  = state.view !== "table";
  document.querySelectorAll(".seg button").forEach(b => {
    const key = keyOf(b);
    b.setAttribute("aria-pressed", String(state[key] === b.dataset[key]));
  });
}


/* ----------------------------------------------------------------- intro */
/* The chart assembles itself in four narrated steps the first time it is
   seen: the metros, where they bunch, the typical one, then Boston. Replay
   re-runs it; reduced-motion readers get the finished chart and only the
   closing caption. */
const chartBox = document.getElementById("chart");
let introTimers = [], introPlayed = false;
/* Direct labels: each step names its mark where it is, on the first row,
   one bubble at a time — the bubble moves with the story. */
const LABELS = [
  "The scale: 1\u00d7 means an industry has the same share of jobs here as nationally \u2014 further right, more specialised.",
  "Each grey dot is one U.S. metro",
  state.design === "band"
    ? "Most metros bunch together \u2014 the darker middle holds half of them"
    : "Half of all metros fall inside this box",
  "The typical metro",
  "Boston"
];
function clearIntroLabel(){ chartBox.querySelectorAll(".intro-label").forEach(n => n.remove()); }
function introLabel(i){
  clearIntroLabel();
  /* each design anchors the bubbles to its own marks: the band's step-3
     bubble points at the darker middle it describes */
  const band = state.design === "band";
  const box = svg.querySelector(band ? ".bandr" : ".boxr"),
        mid2El = svg.querySelector(band ? ".bandm" : ".boxr"),
        med = svg.querySelector(".med"),
        subj = svg.querySelector(".dot-focus");
  if (!box || !mid2El || !med || !subj) return;
  const cr = chartBox.getBoundingClientRect();
  const mid = n => { const r = n.getBoundingClientRect();
                     return { x:(r.left + r.right)/2 - cr.left, top:r.top - cr.top }; };
  const bb = mid(box);
  const ur = svg.querySelector(".unity-label").getBoundingClientRect();
  const anchor = [
    { x:(ur.left + ur.right)/2 - cr.left, top:ur.bottom - cr.top + 16 },
    { x:cr.width/2, top:bb.top }, mid(mid2El), mid(med), mid(subj)
  ][i];
  const lab = document.createElement("div");
  lab.className = i === 0 ? "intro-label below wide" : "intro-label";
  lab.textContent = LABELS[i];
  lab.style.left = anchor.x + "px";
  lab.style.top  = (anchor.top - 8) + "px";
  chartBox.appendChild(lab);
  const lr = lab.getBoundingClientRect();          /* keep the bubble on the sheet */
  if (lr.left  < cr.left + 4)  lab.style.left = (anchor.x + (cr.left + 4 - lr.left)) + "px";
  if (lr.right > cr.right - 4) lab.style.left = (anchor.x - (lr.right - cr.right + 4)) + "px";
  requestAnimationFrame(() => lab.classList.add("on"));
}
/* The key-row control is a three-state transport: play from idle, pause
   while playing, resume from pause. The schedule is elapsed-time aware, so
   a resume picks up exactly where the pause left off. */
let introRunning = false, introPaused = false;
let introStart = 0, introElapsed = 0;
const INTRO_STEPS = [
  [900,  () => introLabel(0)],
  [1500, () => { svg.classList.add("s1"); introLabel(1); introStep = 2; setIntroBtn(); }],
  [3000, () => { svg.classList.add("s2"); introLabel(2); introStep = 3; setIntroBtn(); }],
  [4500, () => { svg.classList.add("s3"); introLabel(3); introStep = 4; setIntroBtn(); }],
  [6000, () => { svg.classList.add("s4"); clearIntroLabel(); demoTip(); introStep = 5; setIntroBtn(); }],
  [7500, finishIntro]
];
let introStep = 0;
const INTRO_API = window.__intro = {
  play: () => playIntro(), pause: () => pauseIntro(), resume: () => resumeIntro(),
  state: () => ({ step: introStep, total: 5, running: introRunning, paused: introPaused }),
  onChange: null
};
window.__chart = {
  setLimit(n){ rowLimit = n; render(); },
  limit: () => rowLimit,
  total: () => DATA.rows.length,
  contentBottom: () => Math.ceil(document.querySelector(".wrap").getBoundingClientRect().bottom)
};
function setIntroBtn(){
  if (INTRO_API.onChange) try { INTRO_API.onChange(INTRO_API.state()); } catch(e){}
}
function scheduleFrom(elapsed){
  introStart = performance.now();
  introTimers = INTRO_STEPS.filter(([t]) => t > elapsed)
    .map(([t, fn]) => setTimeout(fn, t - elapsed));
}
function finishIntro(){
  introTimers.forEach(clearTimeout); introTimers = [];
  svg.classList.remove("intro-anim","s1","s2","s3","s4","paused");
  clearIntroLabel();
  introDots = null; render();
  demoTip();   /* the invitation stays until the cursor takes over */
  introRunning = false; introPaused = false; setIntroBtn();
}
function pauseIntro(){
  introElapsed += performance.now() - introStart;
  introTimers.forEach(clearTimeout); introTimers = [];
  introPaused = true;
  svg.classList.add("paused");
  setIntroBtn();
}
function resumeIntro(){
  introPaused = false;
  svg.classList.remove("paused");
  scheduleFrom(introElapsed);
  setIntroBtn();
}
function playIntro(){
  introTimers.forEach(clearTimeout); introTimers = [];
  svg.classList.remove("intro-anim","s1","s2","s3","s4","paused");
  clearIntroLabel();
  hide();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches){
    introDots = null; render(); return;
  }
  introRunning = true; introPaused = false; introElapsed = 0; introStep = 1;
  introDots = "all"; render();
  setIntroBtn();
  svg.classList.add("intro-anim");
  scheduleFrom(0);
}
const rowsBtn = document.getElementById("rowsBtn");
function syncRowsBtn(){
  if (rowsBtn) rowsBtn.textContent = rowLimit
    ? "Show all " + DATA.rows.length : "Show top 10";
}
function fitFrame(){
  if (!window.frameElement) return;
  const b = Math.ceil(document.querySelector(".wrap").getBoundingClientRect().bottom);
  if (b > 200) window.frameElement.style.height = (b + 14) + "px";
}
if (rowsBtn) rowsBtn.addEventListener("click", () => {
  rowLimit = rowLimit ? null : 10;
  render(); syncRowsBtn(); fitFrame();
});
syncRowsBtn();

buildKey(); buildTable(); syncView(); render();
new ResizeObserver(() => {
  render();
  fitFrame();
}).observe(document.getElementById("chart"));

/* The intro waits for the reader: it starts the first time the chart is
   genuinely on screen — an IntersectionObserver in an iframe measures
   against the top-level viewport, so scrolling the host page counts. */
new IntersectionObserver((entries, io) => {
  if (introPlayed){ io.disconnect(); return; }
  const e = entries[0];
  if (e.isIntersecting && e.intersectionRatio >= 0.35 && chartBox.clientWidth > 0){
    introPlayed = true;
    io.disconnect();
    playIntro();
  }
}, { threshold: [0.35] }).observe(chartBox);
</script>
